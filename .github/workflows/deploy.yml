name: Fabric CI/CD Deployment

on:
  push:
    branches: 
      - '*dev*'
      - '*uat*'  
      - '*prod*'   
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AZURE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Show current and remote branches
        shell: bash
        run: |
          echo "Current ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          git branch -r

      - name: Configure git identity
        shell: bash
        run: |
          git config --global user.email "pipeline@company.com"
          git config --global user.name "Azure Pipeline"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python version
        shell: bash
        run: |
          echo "Using Python:"
          python3 --version
          which python3

      - name: Create virtual environment and install dependencies
        shell: bash
        run: |
          python3 -m venv pipeline_venv
          source pipeline_venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install fabric_cicd
          echo "Virtual environment created and dependencies installed"

      - name: Run deploy.py
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          workspace_id: ${{ secrets.WORKSPACE_ID }}
          script_path: deploy.py
          repo_dir: .
        run: |
          source pipeline_venv/bin/activate
          python "${{ env.script_path }}" --workspace_id "${{ env.workspace_id }}" --repo_dir "${{ github.workspace }}/${{ env.repo_dir }}"
